<!DOCTYPE html>
<html>
<head>
    <title>Position Visualizer</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }
        .control {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 150px;
        }
        input[type="range"] {
            width: 300px;
        }

        /* Simulasi layar Spotify */
        .spotify {
            position: relative;
            width: 100%;
            height: 400px;
            background: #222;
            border: 1px solid #444;
            margin-top: 20px;
            overflow: hidden;
        }

        /* Simulasi player bar */
        .player-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: #000;
            border-top: 1px solid #444;
        }

        /* Video */
        .video-container {
            position: absolute;
            bottom: 0;
            right: 0;
        }

        video {
            width: 147px;
            height: 147px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Position Visualizer</h1>

    <div class="control">
        <label>Bottom (px):</label>
        <input type="range" id="bottom" min="-100" max="100" step="1" value="0">
        <span id="bottomValue">0</span>
    </div>

    <div class="control">
        <label>Right (px):</label>
        <input type="range" id="right" min="0" max="800" step="1" value="365">
        <span id="rightValue">365</span>
    </div>

    <div class="spotify">
        <div class="player-bar"></div>
        <div class="video-container" id="videoContainer">
            <video id="video" src="assets/CorbonPlayGuitar_fixed.webm" loop muted autoplay></video>
        </div>
    </div>

    <script>
        const bottomSlider = document.getElementById("bottom");
        const rightSlider = document.getElementById("right");
        const bottomValue = document.getElementById("bottomValue");
        const rightValue = document.getElementById("rightValue");
        const videoContainer = document.getElementById("videoContainer");

        function update() {
            const b = bottomSlider.value;
            const r = rightSlider.value;
            bottomValue.textContent = b;
            rightValue.textContent = r;
            videoContainer.style.bottom = b + "px";
            videoContainer.style.right = r + "px";
        }

        bottomSlider.addEventListener("input", update);
        rightSlider.addEventListener("input", update);
        update();
    </script>
</body>
</html>
